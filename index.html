  for(const line of lines){

    if(line.includes("・")&&(line.includes("／")||line.includes("/"))){
      const dotIdx=line.indexOf("・");const artist=line.slice(0,dotIdx).trim();
      const titlesRaw=line.slice(dotIdx+1);
      titlesRaw.split(/[／/]/).map(t=>t.trim()).filter(Boolean).forEach(t=>songs.push({title:t,artist}));continue;
    }
    const isKnown=ALL_ARTISTS.some(a=>a.toLowerCase()===line.toLowerCase());
    if(isKnown){currentArtist=ALL_ARTISTS.find(a=>a.toLowerCase()===line.toLowerCase())||line;continue;}
    if(currentArtist)songs.push({title:line,artist:currentArtist});
    else currentArtist=line;
  }
  return songs;
}

  a.download=`setlist_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
}

function App(){
  const [tab,setTab]=useState("live");
  const [listeners,setListeners]=useState(()=>load(SK.listeners)||[]);
  const [repertoire,setRepertoire]=useState(()=>load(SK.repertoire)||[]);
  const [checkedIn,setCheckedIn]=useState(new Set());
  const [pickResult,setPickResult]=useState(null);
  const [pickHistory,setPickHistory]=useState([]);
  const [pickedIds,setPickedIds]=useState(new Set());
  useEffect(()=>save(SK.listeners,listeners),[listeners]);
  useEffect(()=>save(SK.repertoire,repertoire),[repertoire]);
  const toggleCheckIn=(id)=>{setCheckedIn(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});setPickResult(null);};
  const resetPickHistory=()=>{setPickedIds(new Set());setPickHistory([]);setPickResult(null);};
  const pickSong=useCallback(()=>{
    const active=listeners.filter(l=>checkedIn.has(l.id));
    if(!active.length||!repertoire.length)return;
    const favSongSet=new Set();
    active.forEach(l=>{(l.favSongs||[]).forEach(s=>s.split(/[/／]/).forEach(p=>favSongSet.add(p.trim().toLowerCase())));});
    const favArtistSet=new Set();
    active.forEach(l=>{(l.favArtists||[]).forEach(a=>favArtistSet.add(a.toLowerCase().trim()));});
    const songMatch=(t,f)=>t.toLowerCase().trim()===f.toLowerCase().trim();
    const artistMatch=(a,f)=>a.toLowerCase().trim()===f.toLowerCase().trim();
    const songMatches=repertoire.filter(r=>[...favSongSet].some(f=>songMatch(r.title,f)));
    const artistMatches=repertoire.filter(r=>{
      const alreadySong=[...favSongSet].some(f=>songMatch(r.title,f));
      return !alreadySong&&[...favArtistSet].some(f=>artistMatch(r.artist||"",f));
    });
    const unpickedSong=songMatches.filter(r=>!pickedIds.has(r.id));
    const unpickedArtist=artistMatches.filter(r=>!pickedIds.has(r.id));
    const unpickedAll=repertoire.filter(r=>!pickedIds.has(r.id));
    let pool,isMatch,matchLabel;
    if(unpickedSong.length>0){pool=unpickedSong;isMatch=true;matchLabel="song";}
    else if(unpickedArtist.length>0){pool=unpickedArtist;isMatch=true;matchLabel="artist";}
    else if(unpickedAll.length>0){pool=unpickedAll;isMatch=false;matchLabel="none";}
    else{
      const fresh=songMatches.length?songMatches:artistMatches.length?artistMatches:repertoire;
      pool=fresh;isMatch=fresh!==repertoire;matchLabel=fresh===songMatches?"song":fresh===artistMatches?"artist":"none";
      setPickedIds(new Set());
    }
    const lastArtist=pickHistory[0]?.song?.artist?.toLowerCase().trim();
    const poolNoLast=lastArtist?pool.filter(r=>(r.artist||"").toLowerCase().trim()!==lastArtist):pool;
    const finalPool=poolNoLast.length>0?poolNoLast:pool;
    const song=finalPool[Math.floor(Math.random()*finalPool.length)];
    setPickedIds(p=>new Set([...p,song.id]));
    setPickResult({song,isMatch,matchLabel,matchCount:songMatches.length+artistMatches.length,songMatchCount:songMatches.length,artistMatchCount:artistMatches.length,total:repertoire.length});
    setPickHistory(p=>[{song,isMatch,matchLabel,time:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})},...p.slice(0,19)]);
  },[listeners,checkedIn,repertoire,pickedIds,pickHistory]);
  const handleImport=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{try{const data=JSON.parse(ev.target.result);if(data.listeners)setListeners(data.listeners);if(data.repertoire)setRepertoire(data.repertoire);alert("インポート完了！");}catch{alert("ファイルの読み込みに失敗しました");}};
    reader.readAsText(file);
  };
  const TABS=[{id:"live",label:"🎙 LIVE"},{id:"listeners",label:"👥 リスナー"},{id:"repertoire",label:"🎵 レパートリー"},{id:"data",label:"💾 データ"}];
  return(
    <div style={S.root}>
      <div style={S.orb1}/><div style={S.orb2}/>
      <header style={S.header}>
        <div style={S.hLeft}>
          <span style={{color:"#a78bfa",display:"flex"}}>{Ic.music}</span>
          <span style={S.logo}>SetList</span>
        </div>
      </header>
      <div style={S.tabBar}>
        {TABS.map(t=><button key={t.id} style={{...S.tabBtn,...(tab===t.id?S.tabBtnActive:{})}} onClick={()=>setTab(t.id)}>{t.label}</button>)}
      </div>
      <main style={S.main}>
        {tab==="live"&&<LiveTab listeners={listeners} repertoire={repertoire} checkedIn={checkedIn} toggleCheckIn={toggleCheckIn} pickSong={pickSong} pickResult={pickResult} setPickResult={setPickResult} pickHistory={pickHistory} setPickHistory={setPickHistory} pickedIds={pickedIds} resetPickHistory={resetPickHistory}/>}
        {tab==="listeners"&&<ListenersTab listeners={listeners} setListeners={setListeners}/>}
        {tab==="repertoire"&&<RepertoireTab repertoire={repertoire} setRepertoire={setRepertoire}/>}
        {tab==="data"&&<DataTab listeners={listeners} repertoire={repertoire} setListeners={setListeners} setRepertoire={setRepertoire} onExport={()=>exportData(listeners,repertoire)} onImport={handleImport}/>}
      </main>
    </div>
  );
}

function LiveTab({listeners,repertoire,checkedIn,toggleCheckIn,pickSong,pickResult,setPickResult,pickHistory,setPickHistory,pickedIds,resetPickHistory}){
  const [showList,setShowList]=useState(false);const [listFilter,setListFilter]=useState("");
  const activeCount=checkedIn.size;
  const favSet=new Set();

    (l.favSongs||[]).forEach(s=>s.split(/[/／]/).forEach(p=>favSet.add(p.trim().toLowerCase())));
    (l.favArtists||[]).forEach(a=>favSet.add(a.toLowerCase().trim()));
  });
  const reperWithMatch=repertoire.map(r=>{
    const t=r.title.toLowerCase().trim(),a=(r.artist||"").toLowerCase().trim();
    const matched=activeCount>0&&[...favSet].some(f=>t===f||a===f);
    return{...r,matched};
  });
  const filtered=reperWithMatch.filter(r=>!listFilter||r.title.toLowerCase().includes(listFilter.toLowerCase())||r.artist.toLowerCase().includes(listFilter.toLowerCase())).sort((a,b)=>(b.matched?1:0)-(a.matched?1:0));
  const selectFromList=(r)=>{
    setPickResult({song:r,isMatch:r.matched,matchLabel:r.matched?"song":"none",matchCount:reperWithMatch.filter(x=>x.matched).length,songMatchCount:reperWithMatch.filter(x=>x.matched).length,artistMatchCount:0,total:repertoire.length});
    setPickHistory(p=>[{song:r,isMatch:r.matched,matchLabel:r.matched?"song":"none",time:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})},...p.slice(0,9)]);

              <span style={{fontWeight:600}}>{l.name}</span>

          <button style={{...S.modeBtn,...(showList?S.modeBtnOn:{})}} onClick={()=>setShowList(true)}>{Ic.list} リストから選ぶ</button>

              <span style={{fontSize:12,color:"rgba(226,232,240,0.45)"}}>{pickedIds.size>0?`済 ${pickedIds.size}曲 / 残 ${repertoire.length-pickedIds.size}曲`:`全 ${repertoire.length}曲`}</span>

          <div style={{display:"flex",gap:6,marginBottom:12}}>
            <button style={{...S.modeBtn,...(favMode==="artist"?S.modeBtnOn:{})}} onClick={()=>setFavMode("artist")}>🎤 好きなアーティスト</button>
            <button style={{...S.modeBtn,...(favMode==="song"?S.modeBtnOn:{})}} onClick={()=>setFavMode("song")}>🎵 好きな曲</button>
          </div>
          {favMode==="artist"?(
            <>
              <ArtistOnlyInput onAdd={a=>setForm(f=>({...f,favArtists:[...new Set([...f.favArtists,a])]}))} existing={form.favArtists}/>
              {form.favArtists.length>0&&<div style={{...S.tagWrap,marginTop:10}}>{form.favArtists.map((a,i)=><span key={i} style={{...S.tag,...S.tagA}}>{a}<button style={S.tagX} onClick={()=>setForm(f=>({...f,favArtists:f.favArtists.filter((_,j)=>j!==i)}))}>{Ic.x}</button></span>)}</div>}
            </>
          ):(
            <>
              <ArtistTrackPicker onSelect={t=>{const tag=`${t.title} / ${t.artist}`;setForm(f=>({...f,favSongs:f.favSongs.includes(tag)?f.favSongs:[...f.favSongs,tag]}));}} existingTitles={[]}/>
              <div style={{marginTop:10,padding:"10px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)"}}>
                <div style={{fontSize:12,color:"rgba(226,232,240,0.5)",marginBottom:8}}>手動入力</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <input style={{...S.inp,flex:"2 1 120px"}} placeholder="曲名" value={manualSong} onChange={e=>setManualSong(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addManualSong()}/>
                  <input style={{...S.inp,flex:"1.5 1 100px"}} placeholder="アーティスト（任意）" value={manualSongArtist} onChange={e=>setManualSongArtist(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addManualSong()}/>
                  <button style={{...S.btnSmall,flexShrink:0}} onClick={addManualSong}>追加</button>
                </div>
              </div>
              {form.favSongs.length>0&&<div style={{...S.tagWrap,marginTop:10}}>{form.favSongs.map((s,i)=><span key={i} style={{...S.tag,...S.tagS}}>{s}<button style={S.tagX} onClick={()=>setForm(f=>({...f,favSongs:f.favSongs.filter((_,j)=>j!==i)}))}>{Ic.x}</button></span>)}</div>}
            </>
          )}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button style={S.btnP} onClick={commit}>{editId?"更新":"追加"}</button>
          {editId&&<button style={S.btnG} onClick={()=>{setEditId(null);setForm(blank);}}>キャンセル</button>}
        </div>
      </section>
      <section style={S.card}>
        <h2 style={S.cardTitle}><span style={{color:"#a78bfa"}}>{Ic.user}</span> 登録リスナー ({listeners.length}人)</h2>
        {listeners.length===0?<p style={S.empty}>まだ登録がありません</p>:
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {listeners.map(l=>(
              <div key={l.id} style={S.lCard}>
                <div style={S.lHead} onClick={()=>setExpanded(expanded===l.id?null:l.id)}>
                  <span style={{fontWeight:600,fontSize:15}}>{l.name}</span>
                  <div style={{display:"flex",gap:6}}>
                    <button style={S.icnBtn} onClick={e=>{e.stopPropagation();startEdit(l);}}>{Ic.edit}</button>
                    <button style={{...S.icnBtn,color:"#f87171"}} onClick={e=>{e.stopPropagation();setListeners(p=>p.filter(x=>x.id!==l.id));}}>{Ic.trash}</button>
                  </div>
                </div>
                {expanded===l.id&&(
                  <div style={S.lDetail}>
                    {l.memo&&<p style={{fontSize:13,color:"rgba(226,232,240,0.7)",margin:"0 0 8px"}}>{l.memo}</p>}
                    {l.favArtists?.length>0&&<div style={S.tagWrap}><span style={S.tagLbl}>アーティスト:</span>{l.favArtists.map((a,i)=><span key={i} style={{...S.tag,...S.tagA}}>{a}</span>)}</div>}
                    {l.favSongs?.length>0&&<div style={{...S.tagWrap,marginTop:6}}><span style={S.tagLbl}>好き曲:</span>{l.favSongs.map((s,i)=><span key={i} style={{...S.tag,...S.tagS}}>{s}</span>)}</div>}
                  </div>
                )}
              </div>
            ))}
          </div>}
      </section>
    </div>
  );
}

function RepertoireTab({repertoire,setRepertoire}){
  const [mode,setMode]=useState("import");const [title,setTitle]=useState("");const [artist,setArtist]=useState("");const [memo,setMemo]=useState("");
  const [search,setSearch]=useState("");const [importText,setImportText]=useState("");const [preview,setPreview]=useState(null);
  const addFromDB=t=>{if(!repertoire.some(r=>r.title===t.title&&r.artist===t.artist))setRepertoire(p=>[...p,{id:Date.now().toString()+Math.random(),title:t.title,artist:t.artist,memo:""}]);};
  const addManual=()=>{if(!title.trim())return;setRepertoire(p=>[...p,{id:Date.now().toString(),title:title.trim(),artist:artist.trim(),memo:memo.trim()}]);setTitle("");setArtist("");setMemo("");};
  const confirmImport=()=>{
    const newSongs=preview.filter(s=>s.title&&!repertoire.some(r=>r.title===s.title&&r.artist===s.artist)).map(s=>({id:Date.now().toString()+Math.random(),title:s.title,artist:s.artist,memo:""}));
    setRepertoire(p=>[...p,...newSongs]);setImportText("");setPreview(null);alert(`${newSongs.length}曲を追加しました！`);
  };
  const filtered=repertoire.filter(r=>!search||r.title.toLowerCase().includes(search.toLowerCase())||r.artist.toLowerCase().includes(search.toLowerCase()));
  return(
    <div style={S.stack}>
      <section style={S.card}>
        <h2 style={S.cardTitle}><span style={{color:"#34d399"}}>{Ic.plus}</span> 曲を追加</h2>
        <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
          <button style={{...S.modeBtn,...(mode==="import"?S.modeBtnOn:{})}} onClick={()=>{setMode("import");setPreview(null);}}>📋 テキスト一括</button>
          <button style={{...S.modeBtn,...(mode==="db"?S.modeBtnOn:{})}} onClick={()=>setMode("db")}>{Ic.search} DB検索</button>
          <button style={{...S.modeBtn,...(mode==="manual"?S.modeBtnOn:{})}} onClick={()=>setMode("manual")}>{Ic.plus} 手動</button>
        </div>
        {mode==="import"&&(!preview?(
          <>
            <div style={{fontSize:12,color:"rgba(226,232,240,0.5)",marginBottom:8,lineHeight:1.7}}>NOTEの曲リストをそのままペーストしてね✨<br/>アーティスト名の行 → 以降の曲に自動紐付け</div>
            <textarea style={{...S.ta,minHeight:200,fontSize:13}} placeholder={"aiko\nカブトムシ\n桜の時\n\nYOASOBI\n夜に駆ける\nアイドル"} value={importText} onChange={e=>setImportText(e.target.value)}/>
            <button style={{...S.btnP,marginTop:10,width:"100%"}} onClick={()=>setPreview(parseImportText(importText))} disabled={!importText.trim()}>読み込む →</button>
          </>
        ):(
          <>
            <div style={{fontSize:12,color:"rgba(226,232,240,0.6)",marginBottom:8}}>{preview.length}曲を認識しました。確認して「一括追加」</div>
            <div style={{maxHeight:260,overflowY:"auto",display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
              {preview.map((s,i)=>(
                <div key={i} style={{...S.listRow,padding:"7px 10px"}}>
                  <div><div style={{fontSize:13,fontWeight:600}}>{s.title}</div><div style={{fontSize:11,color:"rgba(226,232,240,0.5)"}}>{s.artist||"アーティスト不明"}</div></div>
                  <button style={{...S.icnBtn,color:"#f87171"}} onClick={()=>setPreview(p=>p.filter((_,j)=>j!==i))}>{Ic.x}</button>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button style={S.btnP} onClick={confirmImport}>一括追加 ({preview.filter(s=>!repertoire.some(r=>r.title===s.title&&r.artist===s.artist)).length}曲)</button>
              <button style={S.btnG} onClick={()=>setPreview(null)}>戻る</button>
            </div>
          </>
        ))}
        {mode==="db"&&<ArtistTrackPicker onSelect={addFromDB} existingTitles={repertoire.map(r=>r.title)}/>}
        {mode==="manual"&&(
          <>
            <div style={S.fg}><label style={S.lbl}>曲名 *</label><input style={S.inp} placeholder="曲名" value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addManual()}/></div>
            <div style={S.fg}><label style={S.lbl}>アーティスト</label><input style={S.inp} placeholder="アーティスト名" value={artist} onChange={e=>setArtist(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addManual()}/></div>
            <div style={S.fg}><label style={S.lbl}>メモ（キー・難易度など）</label><input style={S.inp} placeholder="例: capo2" value={memo} onChange={e=>setMemo(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addManual()}/></div>
            <button style={S.btnP} onClick={addManual}>追加</button>
          </>
        )}
      </section>
      <section style={S.card}>
        <h2 style={S.cardTitle}><span style={{color:"#34d399"}}>{Ic.music}</span> レパートリー ({repertoire.length}曲)</h2>
        <input style={{...S.inp,marginBottom:12}} placeholder="🔍 絞り込み…" value={search} onChange={e=>setSearch(e.target.value)}/>
        {filtered.length===0?<p style={S.empty}>{repertoire.length===0?"まだ登録がありません":"見つかりません"}</p>:
          <div style={{maxHeight:480,overflowY:"auto",display:"flex",flexDirection:"column",gap:5}}>
            {filtered.map(r=>(
              <div key={r.id} style={S.rRow}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.title}</div>
                  <div style={{fontSize:12,color:"rgba(226,232,240,0.55)"}}>{r.artist}</div>
                  {r.memo&&<div style={{fontSize:11,color:"#34d399"}}>{r.memo}</div>}
                </div>
                <button style={{...S.icnBtn,color:"#f87171",marginLeft:8,flexShrink:0}} onClick={()=>setRepertoire(p=>p.filter(x=>x.id!==r.id))}>{Ic.trash}</button>
              </div>
            ))}
          </div>}
      </section>
    </div>
  );
}

function DataTab({listeners,repertoire,setListeners,setRepertoire,onExport,onImport}){
  return(
    <div style={S.stack}>
      <section style={S.card}>
        <h2 style={S.cardTitle}><span style={{color:"#f472b6"}}>💾</span> データ管理</h2>
        <p style={{fontSize:13,color:"rgba(226,232,240,0.6)",marginBottom:20,lineHeight:1.7}}>
          エクスポートしたJSONファイルを別の端末でインポートすれば<br/>スマホ↔PCでデータを共有できます📲💻
        </p>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={S.dataCard}>
            <div><div style={{fontWeight:600,marginBottom:2}}>📤 エクスポート</div><div style={{fontSize:12,color:"rgba(226,232,240,0.55)"}}>リスナー{listeners.length}人・レパートリー{repertoire.length}曲をファイルに保存</div></div>
            <button style={S.btnP} onClick={onExport}>ダウンロード</button>
          </div>
          <div style={S.dataCard}>
            <div><div style={{fontWeight:600,marginBottom:2}}>📥 インポート</div><div style={{fontSize:12,color:"rgba(226,232,240,0.55)"}}>エクスポートしたJSONファイルを読み込む</div></div>
            <label style={{...S.btnG,cursor:"pointer",whiteSpace:"nowrap"}}>ファイル選択<input type="file" accept=".json" style={{display:"none"}} onChange={onImport}/></label>
          </div>
          <div style={{...S.dataCard,borderColor:"rgba(248,113,113,0.3)",background:"rgba(248,113,113,0.05)"}}>
            <div><div style={{fontWeight:600,marginBottom:2,color:"#f87171"}}>🗑 全データ削除</div><div style={{fontSize:12,color:"rgba(226,232,240,0.55)"}}>すべてのデータを消去します（元に戻せません）</div></div>
            <button style={{...S.btnG,borderColor:"#f87171",color:"#f87171"}} onClick={()=>{if(window.confirm("本当に全データを削除しますか？")){setListeners([]);setRepertoire([]);}}}>削除</button>
          </div>
        </div>
      </section>
      <section style={S.card}>
        <h2 style={S.cardTitle}><span style={{color:"#34d399"}}>📊</span> データ概要</h2>
        <div style={{display:"flex",gap:12}}>
          <div style={S.statBox}><div style={S.statNum}>{listeners.length}</div><div style={S.statLabel}>リスナー</div></div>
          <div style={S.statBox}><div style={S.statNum}>{repertoire.length}</div><div style={S.statLabel}>レパートリー</div></div>
          <div style={S.statBox}><div style={S.statNum}>{ALL_ARTISTS.length}</div><div style={S.statLabel}>内蔵アーティスト</div></div>
        </div>
      </section>
    </div>
  );
}
